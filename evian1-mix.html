          <div id="wrapper">
              
              
              
            <section>
              <div id="yt_video"></div>

            <section>
              <div id="info">
<!--                <span id="song_title">Song title</span>-->
<!--                <span id="song_artist">Artist:</span>-->
<!--                <span id="song_album">Album:</span>-->
<!--                <span id="song_release_year">Year of release:</span>-->
              </div>
              <div id="listened">
                <input type="range" name="Seek bar" id="seek_bar" min="0" max="100" value="0">
                <div id="time_indic" class="flex_rnw">
                  <span id="song_start">00:00</span>
                  <span id="song_finish">00:00</span>
                </div>
              </div>
              <div>
                <button id="previous"><img src="/Retro_YT_player-main/player_themes/default/backward.png" width="100%" alt="Previous song."></button>
                <button id="toggle"><img src="/Retro_YT_player-main/player_themes/default/play.png" width="100%" alt="Play song."></button>
                <button id="next"><img src="/Retro_YT_player-main/player_themes/default/forward.png" width="100%" alt="Next song."></button>
              </div>
              <div id="secondary_controls">
                <div id="volume" class="flex_rnw">
                  <button id="volume_button"><img src="/Retro_YT_player-main/player_themes/default/volume.png" width="100%" alt="Volume."></button>
                  <input type="range" name="Volume bar" id="volume_bar" min="0" max="100" value="50"></input>
                </div>
